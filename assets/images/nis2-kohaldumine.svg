<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="t2 d2">
  <title id="t2">NIS2 kohaldumise otsustuspuu</title>
  <desc id="d2">Kolm sammu: kas tegevus on I või II lisa tüüpi, kas täidetud on suuruse test, kas kohaldub erand suurusest sõltumata. Tulemus: oluline üksus, tähtis üksus või väljas. Alused: direktiivi artiklid 2 ja 3, soovitus 2003/361/EÜ.</desc>
  <rect width="1000" height="420" fill="#f5f8ff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7088b0"/>
    </marker>
  </defs>
  <g font-family="'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif">
    <!-- step 1 -->
    <rect x="40" y="34" width="250" height="86" rx="12" fill="#ffffff" stroke="#c7d3e8" stroke-width="2"/>
    <text x="60" y="66" font-size="18" fill="#0a2f8f" font-weight="700">1. Tegevus</text>
    <text x="60" y="90" font-size="16" fill="#090c24">Kas tegevus on I või II lisa</text>
    <text x="60" y="110" font-size="16" fill="#090c24">tüüpi?</text>
    <!-- step 2 -->
    <rect x="375" y="34" width="250" height="86" rx="12" fill="#ffffff" stroke="#c7d3e8" stroke-width="2"/>
    <text x="395" y="66" font-size="18" fill="#0a2f8f" font-weight="700">2. Suurus</text>
    <text x="395" y="90" font-size="16" fill="#090c24">Vähemalt 50 töötajat JA</text>
    <text x="395" y="110" font-size="16" fill="#090c24">käive või bilanss üle 10 m€</text>
    <!-- step 3 -->
    <rect x="710" y="34" width="250" height="86" rx="12" fill="#ffffff" stroke="#c7d3e8" stroke-width="2"/>
    <text x="730" y="66" font-size="18" fill="#934700" font-weight="700">3. Erinõue</text>
    <text x="730" y="90" font-size="16" fill="#090c24">Art 2 lg 2: kohaldub ka</text>
    <text x="730" y="110" font-size="16" fill="#090c24">suurusest sõltumata</text>
    <!-- arrows -->
    <line x1="292" y1="77" x2="371" y2="77" stroke="#7088b0" stroke-width="2" marker-end="url(#a)"/>
    <line x1="627" y1="77" x2="706" y2="77" stroke="#7088b0" stroke-width="2" marker-end="url(#a)"/>
    <text x="330" y="68" text-anchor="middle" font-size="14" fill="#56617f">jah</text>
    <text x="665" y="68" text-anchor="middle" font-size="14" fill="#56617f">jah</text>
    <!-- out of scope from step 1 -->
    <line x1="165" y1="122" x2="165" y2="176" stroke="#7088b0" stroke-width="2" marker-end="url(#a)"/>
    <text x="175" y="152" font-size="14" fill="#56617f">ei</text>
    <rect x="40" y="180" width="250" height="56" rx="12" fill="#ffffff" stroke="#c7d3e8" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="165" y="214" text-anchor="middle" font-size="16" fill="#56617f">Ei kuulu kohaldamisalasse</text>
    <!-- out of scope from step 2 -->
    <line x1="500" y1="122" x2="500" y2="176" stroke="#7088b0" stroke-width="2" marker-end="url(#a)"/>
    <text x="510" y="152" font-size="14" fill="#56617f">ei</text>
    <rect x="375" y="180" width="250" height="56" rx="12" fill="#ffffff" stroke="#c7d3e8" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="500" y="205" text-anchor="middle" font-size="16" fill="#56617f">Väljas — välja arvatud juhul,</text>
    <text x="500" y="225" text-anchor="middle" font-size="16" fill="#56617f">kui punkt 3 siiski kohaldub</text>
    <!-- outcomes -->
    <line x1="835" y1="122" x2="835" y2="176" stroke="#0857f8" stroke-width="2" marker-end="url(#a)"/>
    <rect x="640" y="180" width="180" height="60" rx="12" fill="#dce7ff"/>
    <text x="730" y="207" text-anchor="middle" font-size="17" fill="#0a2f8f" font-weight="700">Oluline üksus</text>
    <text x="730" y="228" text-anchor="middle" font-size="14" fill="#0a2f8f">I lisa + üle ülempiiri</text>
    <rect x="830" y="180" width="140" height="60" rx="12" fill="#dce7ff"/>
    <text x="900" y="207" text-anchor="middle" font-size="17" fill="#0a2f8f" font-weight="700">Tähtis üksus</text>
    <text x="900" y="228" text-anchor="middle" font-size="14" fill="#0a2f8f">II lisa või vahemik</text>
    <!-- footer -->
    <line x1="40" y1="268" x2="960" y2="268" stroke="#e1e8f4" stroke-width="2"/>
    <text x="40" y="298" font-size="16" fill="#56617f">Eesti (KüTS § 3): vähemalt 50 töötajat JA kas käive või bilanss üle 10 m€.</text>
    <text x="40" y="326" font-size="16" fill="#56617f">Otsus tuleb dokumenteerida: kes kontrollis, mis vastused, mis kuupäev. Tööleht on lehe allalaaditav CSV.</text>
    <text x="40" y="370" font-size="15" fill="#7088b0">Alus: direktiiv (EL) 2022/2555 artiklid 2 ja 3; Eestis KüTS § 3.</text>
    <text x="40" y="392" font-size="15" fill="#7088b0">Piirijuht: soovitus 2003/361/EÜ „ja/või“ loeb ka alla 50 töötaja, kui mõlemad näitajad &gt; 10 m€.</text>
  </g>
</svg>
