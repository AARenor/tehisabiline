<!doctype html>
<html lang="et">
<head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <!-- Source of /assets/brand/tehisabiline-og.png: render at 1200x630 (see README) and save over that file. -->
    <style>
        @font-face { font-family: "Host Grotesk"; font-weight: 300 800; src: url("../assets/fonts/host-grotesk-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+20AC; }
        @font-face { font-family: "Host Grotesk"; font-weight: 300 800; src: url("../assets/fonts/host-grotesk-latin-ext.woff2") format("woff2"); unicode-range: U+0100-02FF; }
        @font-face { font-family: "Hanken Grotesk"; font-weight: 100 900; src: url("../assets/fonts/hanken-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+20AC; }
        @font-face { font-family: "Hanken Grotesk"; font-weight: 100 900; src: url("../assets/fonts/hanken-latin-ext.woff2") format("woff2"); unicode-range: U+0100-02FF; }
        * { box-sizing: border-box; }
        html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
        body { display: grid; grid-template-columns: 800px 400px; color: #090c24; font-family: "Hanken Grotesk", sans-serif; background: #fff; }
        .copy { position: relative; height: 630px; padding: 62px 56px 54px 68px; }
        .brand { display: flex; align-items: center; gap: 15px; font: 800 31px/1 "Host Grotesk", sans-serif; letter-spacing: -.035em; }
        .brand img { width: 54px; height: 54px; }
        h1 { margin: 81px 0 0; font: 800 59px/1.08 "Host Grotesk", sans-serif; letter-spacing: -.03em; }
        h1 span { display: block; }
        h1 span + span { margin-top: 10px; color: #0857f8; }
        .url { position: absolute; left: 68px; bottom: 55px; color: #0857f8; font-size: 24px; font-weight: 700; letter-spacing: -.015em; }
        .status { margin: 20px 0 0; color: #56617f; font-size: 20px; line-height: 1.3; }
        .mark-field { display: grid; place-items: center; height: 630px; background: #0857f8; }
        .mark-field img { width: 318px; height: 318px; }
    </style>
    </head>
    <body>
    <main class="copy">
        <div class="brand"><img src="../assets/brand/logo.svg" alt="">Tehisabiline</div>
        <h1><span>Küberaudit ja</span><span>pentestimine.</span><span>Keeldudeta AI API.</span></h1>
        <p class="status">AI API on arenduses.</p>
        <div class="url">tehisabiline.ee</div>
    </main>
    <div class="mark-field"><img src="../assets/brand/logo.svg" alt=""></div>
    </body>
    </html>
