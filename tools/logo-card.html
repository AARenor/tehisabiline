<!doctype html>
<html lang="et">
<head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <title>Tehisabiline brand exports</title>
    <style>
        html, body { margin: 0; background: #fff; }
        body { display: flex; align-items: center; gap: 32px; padding: 32px; }
        figure { margin: 0; font: 14px/1.5 system-ui, sans-serif; }
        img { display: block; }
        figcaption { margin-top: 12px; color: #56617f; }
    </style>
</head>
<body>
    <figure><img src="../assets/brand/logo.svg" width="256" height="256" alt="Tehisabiline logo"><figcaption>Vector master</figcaption></figure>
    <figure><img src="../assets/brand/favicon.svg" width="16" height="16" alt="Tehisabiline favicon"><figcaption>16 px, pixel-aligned</figcaption></figure>
    <script>
        async function image(path) {
            const img = new Image();
            img.src = path;
            await img.decode();
            return img;
        }
        (async () => {
            const logo = await image("../assets/brand/logo.svg");
            const small = await image("../assets/brand/favicon.svg");
            const variants = [
                ["favicon-16.png", 16, small, false],
                ["favicon-32.png", 32, small, false],
                ["favicon-64.png", 64, logo, false],
                ["favicon.png", 64, logo, false],
                ["apple-touch-icon.png", 180, logo, true],
                ["icon-192.png", 192, logo, true],
                ["logo-512.png", 512, logo, false],
                ["icon-maskable-512.png", 512, logo, true],
            ];
            const exports = variants.map(([name, size, source, fullBleed]) => {
                const canvas = document.createElement("canvas");
                canvas.width = canvas.height = size;
                const context = canvas.getContext("2d");
                if (fullBleed) {
                    context.fillStyle = "#0857f8";
                    context.fillRect(0, 0, size, size);
                }
                // Inset the maskable glyph so every white pixel stays inside its safe circle.
                const inset = name === "icon-maskable-512.png" ? size * .08 : 0;
                context.drawImage(source, inset, inset, size - 2 * inset, size - 2 * inset);
                return { name, size, png: canvas.toDataURL("image/png").split(",")[1] };
            });
            const output = document.createElement("pre");
            output.id = "exports";
            output.hidden = true;
            output.textContent = JSON.stringify(exports);
            document.body.append(output);
        })().catch(error => {
            document.body.append(document.createTextNode(error.message));
        });
    </script>
</body>
</html>
