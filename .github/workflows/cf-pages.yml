name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      # Publish through the repo's own deploy script, never `pages deploy .`.
      # The checkout is the whole repository, and docs/, tools/, README.md,
      # PRODUCT.md and DESIGN.md are tracked, so a direct upload would publish
      # the internal SEO strategy and product notes. tools/deploy.sh exports
      # `git archive HEAD` and publishes only site files.
      - name: Publish site files to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: bash tools/deploy.sh
